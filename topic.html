<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Applied before first paint to avoid a light/dark flash.
  (function(){
    try{
      var saved = localStorage.getItem('vocab-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      // Synonyms/opposites display: shown unless turned off.
      if(localStorage.getItem('vocab-related') === 'off') document.documentElement.setAttribute('data-related', 'off');
      // Uzbek translation of the B1 example: hidden unless turned on.
      if(localStorage.getItem('vocab-translate') === 'on') document.documentElement.setAttribute('data-translate', 'on');
    }catch(e){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root,
  [data-theme="dark"]{
    --bg: #0E1013;
    --bg-alt: #14171C;
    --line: #262B33;
    --text: #E7E9EC;
    --muted: #8B93A1;
    --accent: #F2B84B;
    --accent-dim: #7A6435;
    --shadow: rgba(0,0,0,0.35);
    --ok: #6CC08B;
    --weak: #E5766B;
  }
  [data-theme="light"]{
    --bg: #F7F5F0;
    --bg-alt: #EEEBE3;
    --line: #DCD7CB;
    --text: #201D18;
    --muted: #6E6A62;
    --accent: #A8681B;
    --accent-dim: #E7D2AC;
    --shadow: rgba(32,29,24,0.08);
    --ok: #2F7D4F;
    --weak: #B2402F;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background .2s ease, color .2s ease;
  }
  a{ color: inherit; text-decoration: none; }
  ::selection{ background: var(--accent-dim); color: var(--text); }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 28px; }
  h1,h2,h3{ font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.01em; }
  .mono{ font-family: 'JetBrains Mono', monospace; }

  /* Scroll position is kept by keepPosition() in the script; turn off the browser's own anchoring so they don't fight. */
  html{ overflow-anchor: none; }
  nav{
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap{ display:flex; align-items:center; justify-content:space-between; height:56px; gap: 12px; }
  .back{ font-size: 14px; color: var(--muted); display:flex; align-items:center; gap:6px; }
  .back:hover{ color: var(--text); }
  .nav-right{ display:flex; align-items:center; gap: 10px; min-width: 0; }
  #topic-title-nav{ font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back{ flex-shrink: 0; }

  .theme-toggle{
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg-alt);
    color: var(--muted); display:flex; align-items:center; justify-content:center;
    cursor: pointer; transition: border-color .15s ease, color .15s ease; flex-shrink:0;
  }
  .theme-toggle:hover{ border-color: var(--accent); color: var(--accent); }
  .random-btn{
    height: 34px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg-alt); color: var(--muted);
    font-family:'JetBrains Mono',monospace; font-size: 12.5px; cursor: pointer;
    transition: border-color .15s ease, color .15s ease; flex-shrink:0;
  }
  .random-btn:hover{ border-color: var(--accent); color: var(--accent); }
  /* On by default; the off state comes from <html data-related="off">, set before first paint. */
  .related-btn{ border-color: var(--accent); color: var(--accent); }
  [data-related="off"] .related-btn{ border-color: var(--line); color: var(--muted); }
  [data-related="off"] .related-btn:hover{ border-color: var(--accent); color: var(--accent); }
  [data-related="off"] .entry-related{ display:none; }
  /* Off by default; the on state comes from <html data-translate="on">, set before first paint. */
  [data-translate="on"] .translate-btn{ border-color: var(--accent); color: var(--accent); }
  .entry-uzex{ display:none; margin-top: 4px; font-size: 14px; }
  [data-translate="on"] .entry-uzex{ display:block; }
  .entry-uzex .uz{ color: var(--text); }
  .entry-uzex .lbl{ font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 11px; color: var(--accent);
    border: 1px solid var(--accent-dim); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .theme-toggle svg{ width: 16px; height: 16px; }
  .theme-toggle .icon-sun{ display:none; }
  [data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  [data-theme="light"] .theme-toggle .icon-moon{ display:none; }

  header.head{ padding: 48px 0 28px; border-bottom: 1px solid var(--line); }
  .topic-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent); margin-bottom:10px; }
  header.head h1{ font-size: 28px; margin-bottom: 8px; }
  header.head p{ color: var(--muted); font-size: 15px; max-width: 60ch; margin-bottom: 24px; }

  .search-box{
    display:flex; align-items:center; gap: 10px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; background: var(--bg-alt);
  }
  .search-box:focus-within{ border-color: var(--accent); }
  .search-box input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-family:'Inter',sans-serif; font-size: 15px;
  }
  .search-box input::placeholder{ color: var(--muted); }
  .search-icon{ color: var(--muted); font-size: 15px; }

  .level-bar{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .level-bar .pill{ height: 34px; padding: 0 8px; border-radius: 8px; background: var(--bg-alt); font-size: 12px; }
  .pill{
    font-family:'JetBrains Mono',monospace; font-size: 12.5px; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer;
  }
  .pill:hover{ color: var(--text); border-color: var(--text); }
  .pill.active{ color: var(--accent); border-color: var(--accent); }

  main{ padding: 32px 0 40px; }

  #count{ font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  .entry{
    border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 12px;
  }
  .entry-top{ display:flex; align-items:baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .entry-word{ font-family:'Space Grotesk',sans-serif; font-size: 19px; font-weight: 600; }
  .entry-pos{ font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--accent); border:1px solid var(--accent-dim); border-radius:4px; padding: 2px 8px; }
  .entry-ipa{ font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted); }
  .entry-forms{ font-size: 13px; color: var(--muted); }
  .entry-forms b{ font-weight: 600; color: var(--text); }
  .entry-forms .lbl{ font-style: normal; color: var(--accent); }
  .entry-def{ font-size: 15px; margin-bottom: 6px; }
  .entry-tr{ font-size: 13.5px; color: var(--accent); margin-bottom: 8px; }
  .entry-ex{ font-size: 14px; color: var(--muted); font-style: italic; }
  .entry-ex::before{ content: "“"; }
  .entry-ex::after{ content: "”"; }
  /* Level group (A = A1 + A2, …): each sentence has its level tag, the quotes go around the sentence only. */
  .entry-ex.has-lv::before, .entry-ex.has-lv::after{ content: none; }
  .entry-ex .ex-t::before{ content: "“"; }
  .entry-ex .ex-t::after{ content: "”"; }
  .entry-ex .ex-lv{ font-family:'JetBrains Mono',monospace; font-style: normal; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .entry-ex.has-lv ~ .entry-ex.has-lv{ margin-top: 6px; }

  .entry-actions{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap: 10px;
    margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .status-group{ display:flex; flex-wrap:wrap; gap: 6px; }
  .status-btn{ font-size: 12px; padding: 3px 9px; }
  .status-btn.active[data-status="memorized"]{ color: var(--ok); border-color: var(--ok); }
  .status-btn.active[data-status="weak"]{ color: var(--weak); border-color: var(--weak); }
  .status-btn.active[data-status="learn"]{ color: var(--accent); border-color: var(--accent); }
  /* Today: picks the word for daily review (separate from the learning status). */
  .today-btn.active{ color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
  .entry.is-memorized{ border-left: 3px solid var(--ok); }
  .entry.is-weak{ border-left: 3px solid var(--weak); }
  .entry.is-learn{ border-left: 3px solid var(--accent); }
  .dict-link{ font-family:'JetBrains Mono',monospace; font-size: 12px; color: var(--muted); }
  .dict-link:hover{ color: var(--accent); }

  .no-results{ color: var(--muted); text-align:center; padding: 48px 0; font-size: 15px; }

  .topic-nav{
    display:flex; flex-wrap:wrap; gap:8px; margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line);
  }
  .topic-nav a{
    font-family:'JetBrains Mono',monospace; font-size: 13px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
  }
  .topic-nav a.active{ color: var(--accent); border-color: var(--accent); }
  .topic-nav a:hover{ color: var(--text); border-color: var(--text); }

  footer{ padding: 32px 0 48px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

  @media (max-width: 600px){
    header.head{ padding: 32px 0 22px; }
    header.head h1{ font-size: 23px; }
    #topic-title-nav{ display:none; }
    nav .wrap{ height:auto; flex-wrap:wrap; padding-top:10px; padding-bottom:10px; gap:8px 10px; }
    .nav-right{ display:contents; }
    .back{ margin-right:auto; }
    .level-bar{ order:3; width:100%; }
    .level-bar .pill{ flex:1; height:32px; }
  }
  @media print{
    nav, .search-box, .topic-nav, .theme-toggle, .level-bar, .status-group{ display:none; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="back" href="index.html">← All topics</a>
    <div class="nav-right">
      <span id="topic-title-nav" class="mono"></span>
      <div class="level-bar" id="level-bar" role="group" aria-label="Example sentence CEFR level" title="Example sentence level"></div>
      <button class="random-btn" type="button" data-random-word title="Show a random word from all topics">↻ Random</button>
      <button class="random-btn related-btn" id="related-toggle" type="button" aria-pressed="true" title="Show or hide synonyms and opposites">⇄ Synonyms</button>
      <button class="random-btn translate-btn" id="translate-toggle" type="button" aria-pressed="false" title="Show or hide the Uzbek translation of the example sentences">文 Translate</button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <div class="topic-eyebrow mono" id="topic-number"></div>
    <h1 id="topic-title"></h1>
    <p id="topic-desc"></p>
    <div class="search-box">
      <span class="search-icon mono">/</span>
      <input id="search" type="text" placeholder="Search words or translations..." autocomplete="off">
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="count" class="mono"></div>
    <div id="entries"></div>
    <div id="no-results" class="no-results" style="display:none;">No words match your search.</div>

    <div class="topic-nav" id="topic-nav"></div>
  </div>
</main>

<footer>
  <div class="wrap">English Vocabulary · Self-study topic-based reference · Dictionary source: <a href="https://www.oxfordlearnersdictionaries.com/" target="_blank" rel="noopener">Oxford Learner's Dictionaries</a></div>
</footer>

<script src="data.js"></script>
<script src="examples.js"></script>
<script src="data_part1.js"></script>
<script src="examples_part1.js"></script>
<script src="irregular.js"></script>
<script src="synonyms.js"></script>
<script src="tr-loader.js"></script>
<script src="random.js"></script>
<script src="scroll.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  // Part 1 topics live in data_part1.js / examples_part1.js; Part 2 in data.js / examples.js.
  const part = params.get('part') === '1' ? '1' : '2';
  const SOURCE = part === '1' ? (window.VOCAB_DATA_PART1 || {}) : window.VOCAB_DATA;
  const partQS = part === '1' ? '&part=1' : '';
  const keys = Object.keys(SOURCE);
  const topicKey = SOURCE[params.get('topic')] ? params.get('topic') : keys[0];
  const data = SOURCE[topicKey];
  document.querySelector('nav .back').href = `index.html?part=${part}`;

  document.title = `${data.title} — English Vocabulary`;
  document.getElementById('topic-number').textContent = `Part ${part} · ${topicKey}`;
  document.getElementById('topic-title').textContent = data.title;
  document.getElementById('topic-title-nav').textContent = `${topicKey} · ${data.title}`;
  document.getElementById('topic-desc').textContent = data.desc;

  const entriesEl = document.getElementById('entries');
  const countEl = document.getElementById('count');
  const noResultsEl = document.getElementById('no-results');
  const searchEl = document.getElementById('search');

  // ----- Persistent storage helpers (same pattern as the theme toggle) -----
  function loadJSON(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  // ----- CEFR level for example sentences -----
  const LEVELS = ['A1','A2','B1','B2','C1','C2'];
  // The buttons are level groups: A shows the A1 and A2 sentences, B shows B1 + B2, C shows C1 + C2.
  const GROUPS = { A: ['A1','A2'], B: ['B1','B2'], C: ['C1','C2'] };
  const examples = ((part === '1' ? window.VOCAB_EXAMPLES_PART1 : window.VOCAB_EXAMPLES) || {})[topicKey] || {};
  let level = loadJSON('vocab-level', null);
  if(LEVELS.includes(level)) level = level[0]; // a level saved before the merge (e.g. "B2") -> its group ("B")
  if(!GROUPS[level]) level = null; // null = original example from data.js

  // The example sentences shown for a word: [{lv, en}] (lv = null for the original example).
  function examplesFor(item){
    const set = examples[item.w];
    if(level && set){
      const list = GROUPS[level].map(lv => ({ lv, en: set[LEVELS.indexOf(lv)] })).filter(x => x.en);
      if(list.length) return list;
    }
    return [{ lv: null, en: item.ex }];
  }

  // Uzbek translations of this topic's A1–C2 example sentences: level -> word -> Uzbek sentence.
  // Loaded from translations/part<P>/<topic>.js after the first render (see the end of this script).
  let topicUz = {};
  // Each level sentence followed by its Uzbek translation (shown only while Translate is on).
  function exampleHTML(item){
    return examplesFor(item).map(x => {
      if(!x.lv) return `<div class="entry-ex">${x.en}</div>`;
      const uz = (topicUz[x.lv] || {})[item.w];
      return `<div class="entry-ex has-lv"><i class="ex-lv">${x.lv}</i><span class="ex-t">${x.en}</span></div>` +
        (uz ? `<div class="entry-uzex"><div class="uz"><i class="lbl">UZ</i>${uz}</div></div>` : '');
    }).join('');
  }

  // Runs change() (which may make the entries taller or shorter) without moving what the reader is looking at.
  // The word card in the middle of the screen (below the sticky top bar) stays at exactly the same place.
  // If the page becomes too short to keep that position, extra space is added at the bottom instead of
  // letting the browser pull the page up.
  let keepPad = 0;
  function keepPosition(change){
    const navB = document.querySelector('nav').getBoundingClientRect().bottom;
    const mid = navB + (window.innerHeight - navB) / 2;
    const cards = entriesEl.querySelectorAll('.entry');
    let index = -1, before = 0;
    for(let i = 0; i < cards.length; i++){
      const r = cards[i].getBoundingClientRect();
      if(r.bottom > mid){ index = i; before = r.top; break; }
    }
    // Below the last card (topic list, footer) nothing changes size, so keep the end of the cards in place instead.
    const endBefore = entriesEl.getBoundingClientRect().bottom;
    change();
    // Remove space added by an earlier call, then work out where the page has to be.
    // Positions are measured from the top of the page, because the browser may already have
    // pulled the page up (if it got shorter) before this point.
    if(keepPad){ document.body.style.paddingBottom = ''; keepPad = 0; }
    const card = index >= 0 ? entriesEl.querySelectorAll('.entry')[index] : null;
    const target = card ? window.scrollY + card.getBoundingClientRect().top - before
                        : window.scrollY + entriesEl.getBoundingClientRect().bottom - endBefore;
    const missing = Math.ceil(target + window.innerHeight - document.documentElement.scrollHeight);
    if(missing > 0){
      keepPad = missing;
      document.body.style.paddingBottom = (parseFloat(getComputedStyle(document.body).paddingBottom) + missing) + 'px';
    }
    window.scrollTo(0, target);
  }

  const levelBar = document.getElementById('level-bar');
  Object.keys(GROUPS).forEach(lv => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill level-btn';
    b.dataset.level = lv;
    b.textContent = lv;
    b.title = `Show ${GROUPS[lv].join(' and ')} example sentences (click again for the original)`;
    levelBar.appendChild(b);
  });
  function syncLevelButtons(){
    levelBar.querySelectorAll('.level-btn').forEach(b => {
      const on = b.dataset.level === level;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  levelBar.addEventListener('click', e => {
    const b = e.target.closest('.level-btn');
    if(!b) return;
    level = (level === b.dataset.level) ? null : b.dataset.level;
    saveJSON('vocab-level', level);
    syncLevelButtons();
    keepPosition(() => render(searchEl.value));
  });
  syncLevelButtons();

  // ----- Learning status per word (persisted) -----
  const STATUSES = [
    { key: 'memorized', label: 'Memorized' },
    { key: 'weak',      label: 'Weak' },
    { key: 'learn',     label: 'Need to Learn' }
  ];
  const statusMap = loadJSON('vocab-status', {});
  // Part 2 keeps the original id format so existing saved statuses still match.
  const statusId = item => `${part === '1' ? 'p1:' : ''}${topicKey}|${item.w}`;

  function applyStatus(div, status){
    STATUSES.forEach(s => div.classList.toggle(`is-${s.key}`, s.key === status));
    div.querySelectorAll('.status-btn').forEach(b => {
      const on = b.dataset.status === status;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // ----- Today: words picked for daily review (list shown on the main page, see today.js) -----
  let todayList = loadJSON('vocab-today', []);
  if(!Array.isArray(todayList)) todayList = [];
  function applyToday(div){
    const on = todayList.includes(div.dataset.id), b = div.querySelector('.today-btn');
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? '★ Today' : '☆ Today';
  }
  entriesEl.addEventListener('click', e => {
    const b = e.target.closest('.today-btn');
    if(!b) return;
    const div = b.closest('.entry'), id = div.dataset.id;
    todayList = loadJSON('vocab-today', []);            // may have changed in another tab
    if(!Array.isArray(todayList)) todayList = [];
    todayList = todayList.includes(id) ? todayList.filter(x => x !== id) : todayList.concat(id);
    saveJSON('vocab-today', todayList);
    applyToday(div);
  });
  // The list may have been changed on the main page (Clear, Remove) — refresh when coming back to this page.
  function refreshToday(){
    todayList = loadJSON('vocab-today', []);
    if(!Array.isArray(todayList)) todayList = [];
    entriesEl.querySelectorAll('.entry').forEach(applyToday);
  }
  window.addEventListener('pageshow', refreshToday);
  window.addEventListener('storage', e => { if(e.key === 'vocab-today') refreshToday(); });

  entriesEl.addEventListener('click', e => {
    const b = e.target.closest('.status-btn');
    if(!b) return;
    const div = b.closest('.entry');
    const id = div.dataset.id;
    const next = statusMap[id] === b.dataset.status ? null : b.dataset.status;
    if(next) statusMap[id] = next; else delete statusMap[id];
    saveJSON('vocab-status', statusMap);
    applyStatus(div, next);
  });

  // ----- Dictionary source: Oxford Learner's Dictionaries only -----
  const oxfordUrl = w => `https://www.oxfordlearnersdictionaries.com/search/english/?q=${encodeURIComponent(w)}`;
  // Irregular verbs: past simple and past participle next to the transcription.
  function formsHTML(item){
    const f = window.verbForms ? window.verbForms(item) : null;
    return f ? `<span class="entry-forms"><i class="lbl">Past:</i> <b>${f.past}</b> · <i class="lbl">Past participle:</i> <b>${f.participle}</b></span>` : '';
  }
  // Adjectives, nouns and verbs: synonyms and opposites next to the transcription.
  function relatedHTML(item){
    const r = window.adjRelated ? window.adjRelated(item) : null;
    if(!r) return '';
    const parts = [];
    if(r.syn.length) parts.push(`<i class="lbl">Synonyms:</i> <b>${r.syn.join(', ')}</b>`);
    if(r.ant.length) parts.push(`<i class="lbl">Opposites:</i> <b>${r.ant.join(', ')}</b>`);
    return `<span class="entry-forms entry-related">${parts.join(' · ')}</span>`;
  }

  function render(filter){
    const q = (filter || '').trim().toLowerCase();
    const filtered = data.words.filter(item =>
      !q || item.w.toLowerCase().includes(q) || item.def.toLowerCase().includes(q) ||
      (item.tr && item.tr.toLowerCase().includes(q))
    );

    entriesEl.innerHTML = '';
    if(filtered.length === 0){
      noResultsEl.style.display = 'block';
    } else {
      noResultsEl.style.display = 'none';
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'entry';
        div.dataset.id = statusId(item);
        div.innerHTML = `
          <div class="entry-top">
            <span class="entry-word">${item.w}</span>
            <span class="entry-pos mono">${item.p}</span>
            <span class="entry-ipa">${item.ipa}</span>
            ${formsHTML(item)}${relatedHTML(item)}
          </div>
          <div class="entry-def">${item.def}</div>
          ${item.tr ? `<div class="entry-tr">${item.tr}</div>` : ''}
          ${exampleHTML(item)}
          <div class="entry-actions">
            <div class="status-group" role="group" aria-label="Learning status">
              ${STATUSES.map(s => `<button type="button" class="pill status-btn" data-status="${s.key}">${s.label}</button>`).join('')}
              <button type="button" class="pill today-btn" aria-pressed="false" title="Add this word to today's review list (shown on the main page)">☆ Today</button>
            </div>
            <a class="dict-link" href="${oxfordUrl(item.w)}" target="_blank" rel="noopener">Oxford ↗</a>
          </div>
        `;
        applyStatus(div, statusMap[div.dataset.id] || null);
        applyToday(div);
        entriesEl.appendChild(div);
      });
    }
    countEl.textContent = `${filtered.length} of ${data.words.length} words` + (level ? ` · ${GROUPS[level].join(' + ')} examples` : '');
  }

  searchEl.addEventListener('input', e => render(e.target.value));
  searchEl.value = params.get('q') || '';
  render(searchEl.value);

  // Load only this topic's translations, then render again so they appear.
  if(window.loadTopicTranslations){
    window.loadTopicTranslations(part, topicKey).then(d => { topicUz = d; keepPosition(() => render(searchEl.value)); });
  }

  // Topic switcher
  const navEl = document.getElementById('topic-nav');
  keys.forEach(key => {
    const a = document.createElement('a');
    a.href = `topic.html?topic=${key}${partQS}`;
    a.textContent = `${key} · ${SOURCE[key].title}`;
    if(key === topicKey) a.classList.add('active');
    navEl.appendChild(a);
  });

  // Theme toggle
  const toggleBtn = document.getElementById('theme-toggle');
  toggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('vocab-theme', next); }catch(e){}
  });

  // Synonyms and opposites on/off
  const relatedBtn = document.getElementById('related-toggle');
  const syncRelated = () => relatedBtn.setAttribute('aria-pressed', document.documentElement.getAttribute('data-related') === 'off' ? 'false' : 'true');
  syncRelated();
  relatedBtn.addEventListener('click', () => {
    const off = document.documentElement.getAttribute('data-related') !== 'off';
    keepPosition(() => {
      if(off) document.documentElement.setAttribute('data-related', 'off');
      else document.documentElement.removeAttribute('data-related');
    });
    try{ localStorage.setItem('vocab-related', off ? 'off' : 'on'); }catch(e){}
    syncRelated();
  });

  // Uzbek translation of the B1 examples on/off
  const translateBtn = document.getElementById('translate-toggle');
  const syncTranslate = () => translateBtn.setAttribute('aria-pressed', document.documentElement.getAttribute('data-translate') === 'on' ? 'true' : 'false');
  syncTranslate();
  translateBtn.addEventListener('click', () => {
    const on = document.documentElement.getAttribute('data-translate') !== 'on';
    keepPosition(() => {
      if(on) document.documentElement.setAttribute('data-translate', 'on');
      else document.documentElement.removeAttribute('data-translate');
    });
    try{ localStorage.setItem('vocab-translate', on ? 'on' : 'off'); }catch(e){}
    syncTranslate();
  });
</script>

</body>
</html>
